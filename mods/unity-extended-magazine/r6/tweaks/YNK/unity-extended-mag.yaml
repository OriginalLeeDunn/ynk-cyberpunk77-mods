# YNK Tweaks - Unity extended magazine
# Doubles the Unity pistol's base magazine for every variant.
#
# The 28 Unity weapon records use three Technical stat groups. Each has one stat modifier that
# sets BaseStats.MagazineCapacityBase (Additive); this edits all three. Found with the
# ynk_explorer CET dump; check one in the CET console with:
#   print(TweakDB:GetFlat("Items.Base_Unity_Technical_Stats_inline2.value"))

# Default, Military, Neon, Pimp, V's own, craftables: 12 -> 24
Items.Base_Unity_Technical_Stats_inline2:
  value: 24

# Agent (iconic): 10 -> 20 (added in 1.0.1)
Items.Base_Unity_Agent_Technical_Stats_inline2:
  value: 20

# Angelica (iconic): 12 -> 24 (added in 1.0.1)
Items.Base_Unity_Angelica_Technical_Stats_inline2:
  value: 24
